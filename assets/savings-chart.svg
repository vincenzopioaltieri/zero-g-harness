<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 375" width="900" height="375" role="img" aria-label="Expected token and code savings chart">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="barIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="barViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="barEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect width="900" height="375" rx="16" fill="url(#cardBg)"/>
  <rect x="1" y="1" width="898" height="373" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="42" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700">Expected Reduction in Tokens, Output &amp; Code Bloat</text>
  <text x="36" y="64" fill="#94A3B8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5">Upstream tool benchmarks (expected gains • end-to-end field validation ongoing)</text>

  <!-- Vertical scale guides (0%, 25%, 50%, 75%, 100%) on track x=305..765 (width=460) -->
  <g stroke="#1E293B" stroke-width="1" stroke-dasharray="3 4">
    <line x1="305" y1="84" x2="305" y2="322"/>
    <line x1="420" y1="84" x2="420" y2="322"/>
    <line x1="535" y1="84" x2="535" y2="322"/>
    <line x1="650" y1="84" x2="650" y2="322"/>
    <line x1="765" y1="84" x2="765" y2="322"/>
  </g>
  <g fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" text-anchor="middle">
    <text x="305" y="336">0%</text>
    <text x="420" y="336">25%</text>
    <text x="535" y="336">50%</text>
    <text x="650" y="336">75%</text>
    <text x="765" y="336">100%</text>
  </g>

  <!-- Row 1: Context Mode (94-99%, bar at 96.5% = 444px) -->
  <g transform="translate(0, 96)">
    <text x="36" y="13" fill="#F1F5F9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Context Mode (FTS5)</text>
    <text x="36" y="29" fill="#64748B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">&gt;10 KB tool outputs &amp; docs</text>
    <rect x="305" y="6" width="460" height="20" rx="10" fill="#1E293B"/>
    <rect x="305" y="6" width="444" height="20" rx="10" fill="url(#barCyan)"/>
    <text x="782" y="21" fill="#22D3EE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="700">94%–99%</text>
  </g>

  <!-- Row 2: RTK (60-90%, bar at 75% midpoint = 345px, range tick 60%=276px to 90%=414px) -->
  <g transform="translate(0, 144)">
    <text x="36" y="13" fill="#F1F5F9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">RTK (PreToolUse Hook)</text>
    <text x="36" y="29" fill="#64748B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">Shell, git, build &amp; test logs</text>
    <rect x="305" y="6" width="460" height="20" rx="10" fill="#1E293B"/>
    <rect x="305" y="6" width="414" height="20" rx="10" fill="#38BDF8" fill-opacity="0.25"/>
    <rect x="305" y="6" width="345" height="20" rx="10" fill="url(#barBlue)"/>
    <text x="782" y="21" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="700">60%–90%</text>
  </g>

  <!-- Row 3: Repomix (~70% = 322px) -->
  <g transform="translate(0, 192)">
    <text x="36" y="13" fill="#F1F5F9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Repomix (--compress)</text>
    <text x="36" y="29" fill="#64748B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">Large repo Tree-sitter packing</text>
    <rect x="305" y="6" width="460" height="20" rx="10" fill="#1E293B"/>
    <rect x="305" y="6" width="322" height="20" rx="10" fill="url(#barIndigo)"/>
    <text x="782" y="21" fill="#818CF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="700">~70%</text>
  </g>

  <!-- Row 4: Ponytail LoC (~54% = 248px) -->
  <g transform="translate(0, 240)">
    <text x="36" y="13" fill="#F1F5F9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Ponytail (Code Bloat)</text>
    <text x="36" y="29" fill="#64748B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">Fewer generated lines of code</text>
    <rect x="305" y="6" width="460" height="20" rx="10" fill="#1E293B"/>
    <rect x="305" y="6" width="248" height="20" rx="10" fill="url(#barViolet)"/>
    <text x="782" y="21" fill="#A78BFA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="700">~54%</text>
  </g>

  <!-- Row 5: Ponytail Tokens/Cost/Time (20-27%, bar at 22% = 101px, range to 27% = 124px) -->
  <g transform="translate(0, 288)">
    <text x="36" y="13" fill="#F1F5F9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Ponytail (Tokens &amp; Time)</text>
    <text x="36" y="29" fill="#64748B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">Lower token usage, cost &amp; latency</text>
    <rect x="305" y="6" width="460" height="20" rx="10" fill="#1E293B"/>
    <rect x="305" y="6" width="124" height="20" rx="10" fill="#34D399" fill-opacity="0.25"/>
    <rect x="305" y="6" width="101" height="20" rx="10" fill="url(#barEmerald)"/>
    <text x="782" y="21" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="700">20%–27%</text>
  </g>

  <!-- Footer -->
  <text x="36" y="360" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Track your real local savings:  rtk gain   •   /ctx-stats</text>
</svg>
